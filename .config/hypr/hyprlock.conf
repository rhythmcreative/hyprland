# Colores base de reserva si pywal todavia no ha generado su paleta
$color0 = rgb(101012)
$color1 = rgb(546065)
$color2 = rgb(a45e4c)
$color3 = rgb(e59a78)
$color4 = rgb(5b7a84)
$color5 = rgb(6f8c94)
$color6 = rgb(9a9d9e)
$color7 = rgb(c2c8c9)
$color8 = rgb(878c8c)
$color9 = rgb(546065)
$color10 = rgb(a45e4c)
$color11 = rgb(e59a78)
$color12 = rgb(5b7a84)
$color13 = rgb(6f8c94)
$color14 = rgb(9a9d9e)
$color15 = rgb(c2c8c9)
$foreground = rgb(c2c8c9)
$background = rgb(101012)

# Importar colores de pywal mejorados
source = ~/.cache/wal/colors-hyprland-enhanced.conf

# Configuracion general elegante
general {
    immediate_render = true
    hide_cursor = true
    ignore_empty_input = false
    fail_timeout = 2000
}

# Fondo con blur elegante (aplica a todos los monitores)
background {
    monitor =
    path = screenshot
    color = rgba(10, 10, 10, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Avatar/Imagen de perfil
image {
    monitor =
    path = ~/.config/hypr/assets/avatar.png
    reload_time = -1
    reload_cmd = [ -f "$HOME/.face" ] && echo "$HOME/.face" || ([ -f "$HOME/.face.icon" ] && echo "$HOME/.face.icon" || echo "$HOME/.config/hypr/assets/avatar.png")
    size = 160
    rounding = -1
    border_size = 4
    border_color = $color1
    rotate = 0
    position = 0, 200
    halign = center
    valign = center
}

# Campo de entrada principal
input-field {
    monitor =
    size = 350, 55
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $color1
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = $foreground
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = Ingresa tu contraseña
    hide_input = false
    rounding = 20
    check_color = $color2
    fail_color = $color9
    fail_text = Contraseña incorrecta
    capslock_color = $color11
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -150
    halign = center
    valign = center
}

# Etiqueta de bienvenida
label {
    monitor =
    text = cmd[update:1000] echo "Bienvenido de vuelta, $USER"
    color = $foreground
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)
}

# Etiqueta de fecha y hora
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = $color7
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.6)
}

# Reloj elegante
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color1
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.9)
}

# Indicador de estado de red
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/network_status.sh
    color = $color3
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -50, -50
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Indicador de bateria
label {
    monitor =
    text = cmd[update:10000] ~/.config/hypr/scripts/battery_status.sh
    color = $color4
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 50, -50
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Cita inspiracional
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/daily_quote.sh
    color = $color6
    font_size = 12
    font_family = JetBrainsMono Nerd Font Italic
    position = 0, -250
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 1
    shadow_color = rgba(0, 0, 0, 0.4)
}
