# --- Kitty Configuration (Modern & Optimized) ---

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Fallback CJK (Chinese, Japanese, Korean) glyph mapping
symbol_map U+2E80-U+2FD5,U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+3100-U+312F,U+31A0-U+31BF,U+31F0-U+31FF,U+3200-U+32FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+AC00-U+D7AF,U+F900-U+FAFF Noto Sans CJK SC

# Window Layout
window_padding_width 15
confirm_os_window_close 0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5

# Transparency & Background
background_opacity 0.85
dynamic_background_opacity yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Terminal Bell
enable_audio_bell no

# Pywal Colors Integration
include ~/.cache/wal/colors-kitty.conf

# Tus cambios, cargados AL FINAL y por eso ganan sobre todo lo de arriba.
# Este kitty.conf viene del repo y el update lo re-pone; lo que quieras
# cambiar sin que te lo pisen va en user.conf, que no se toca.
#
# El patron tiene que ser RELATIVO. Con `globinclude ~/.config/kitty/user.conf`
# kitty avisa en cada arranque:
#
#   Non-relative patterns are unsupported in line: globinclude ~/.config/...
#
# El error es del propio kitty: globinclude solo admite rutas relativas al
# directorio de este fichero, que ya es ~/.config/kitty. Un `include` con ruta
# absoluta si funciona, pero entonces se pierde el comodin.
globinclude user.conf

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0
