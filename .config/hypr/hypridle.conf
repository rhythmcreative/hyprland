general {
    # hyprlock y no loginctl lock-session: Hyprland no implementa la interfaz
    # org.freedesktop.login1.Session Lock, asi que loginctl lock-session no
    # bloqueaba nada. hypridle solo llama a lock_cmd cuando un listener dice
    # "lock", asi que el comando correcto va aqui.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock
    # hyprctl dispatch dpms on no funciona en Hyprland 0.56 (hyprctl mete los
    # args dentro de hl.dispatch(...) y eso no es Lua). screen-power usa
    # hyprctl repl, que si ejecuta Lua, y el dispatcher dpms si existe en la
    # API. Verificado.
    after_sleep_cmd = ~/.local/bin/screen-power on
}

listener {
    timeout = 300                                # 5 minutos: bloquea la sesion
    on-timeout = lock
}

# Apagado de pantalla por reposo: DESACTIVADO. Apagaba las pantallas a los
# 5.5 minutos y el negro se confundia con un cuelgue o con el bloqueo; el
# bloqueo de arriba ya protege la sesion y la suspension de abajo ya ahorra
# bateria. Si algun dia se quiere de vuelta, basta con descomentar esto.
# listener {
#     timeout = 330
#     on-timeout = ~/.local/bin/screen-power off
#     on-resume = ~/.local/bin/screen-power on
# }

listener {
    timeout = 3600                               # 60 minutos: suspende
    on-timeout = systemctl suspend
}
