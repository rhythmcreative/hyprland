# ╔════════════════════════════════════════════════════════════════════════════╗
# ║  rhythm's hyprland - Standard Hyprland Configuration                      ║
# ║  Compatibility layer for Hyprland versions < 0.55 (Ubuntu, Debian, etc.) ║
# ╚════════════════════════════════════════════════════════════════════════════╝

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

# Colors from pywal (if generated)
source = ~/.cache/wal/colors-hyprland.conf

# Monitors configuration (managed by nwg-displays or installer)
source = ~/.config/hypr/monitors.conf

### AUTOSTART ###
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 2>/dev/null || dbus-update-activation-environment --all WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 2>/dev/null || true
exec-once = command -v systemctl >/dev/null 2>&1 && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP || true
exec-once = ~/.local/bin/polkit-agent-launch &
exec-once = ~/.local/bin/load-last-wallpaper-fast &
exec-once = command -v pipewire >/dev/null 2>&1 && ! pidof -s pipewire >/dev/null 2>&1 && pipewire &
exec-once = command -v wireplumber >/dev/null 2>&1 && ! pidof -s wireplumber >/dev/null 2>&1 && wireplumber &
exec-once = command -v pipewire-pulse >/dev/null 2>&1 && ! pidof -s pipewire-pulse >/dev/null 2>&1 && pipewire-pulse &
exec-once = command -v wl-paste >/dev/null 2>&1 && command -v cliphist >/dev/null 2>&1 && ! pidof -s cliphist >/dev/null 2>&1 && wl-paste --type text --watch cliphist store &
exec-once = command -v wl-paste >/dev/null 2>&1 && command -v cliphist >/dev/null 2>&1 && ! pidof -s cliphist >/dev/null 2>&1 && wl-paste --type image --watch cliphist store &
exec-once = gnome-keyring-daemon --start --components=secrets &
exec-once = nm-applet --indicator &
exec-once = hypridle &
exec-once = ~/.config/waybar/launch.sh &
exec-once = ~/.local/bin/rust-dock-launcher &
exec-once = ~/.local/bin/quickshell-island &
exec-once = sleep 0.8 && ~/.local/bin/modern-pywal-sync --startup

### ENVIRONMENT VARIABLES ###
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum
# NVIDIA environment variables (enabled automatically by installer when NVIDIA GPU is present)
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = __NV_PRIME_RENDER_OFFLOAD,1

### GENERAL LOOK AND FEEL ###
general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(9a9d9eff) rgba(5b7a84ff) 45deg
    col.inactive_border = rgba(878c8cff)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 0.85
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(101012ff)
    }
    blur {
        enabled = true
        size = 15
        passes = 3
        vibrancy = 0.5
    }
}

animations {
    enabled = true
    bezier = default, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 4, quick
    animation = layersIn, 1, 4, quick
    animation = layersOut, 1, 3.5, quick
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    disable_watchdog_warning = true
    background_color = 0x111319
    vrr = 1
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    enable_swallow = true
    swallow_regex = ^(kitty)$
    focus_on_activate = true
    layers_hog_keyboard_focus = false
}

debug {
    vfr = true
}

### INPUT ###
input {
    kb_layout = us,es
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# Gestures (Hyprland 0.51+ syntax)
gesture = 3, horizontal, workspace


device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

### WINDOW RULES & LAYERS ###
windowrulev2 = suppressevent maximize, class:.*

layerrule = blur, rofi
layerrule = animation slide top, waybar
layerrule = animation slide bottom, rust-dock
layerrule = animation slide top, quickshell

### KEYBINDINGS ###
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, space, exec, ~/.local/bin/rust-dock-toggle-all
bind = $mainMod, SPACE, exec, ~/.local/bin/rust-dock-toggle-all
bind = SUPER, space, exec, ~/.local/bin/rust-dock-toggle-all
bind = SUPER, SPACE, exec, ~/.local/bin/rust-dock-toggle-all
bind = $mainMod, I, exec, ~/.local/bin/toggle-island
bind = $mainMod, F, exec, ~/.local/bin/show-hotkeys
bind = $mainMod, X, exec, ~/.local/bin/settings-menu
bind = $mainMod, N, exec, ~/.local/bin/rofi-wifi-menu
bind = $mainMod, B, exec, ~/.local/bin/rofi-bluetooth-menu
bind = $mainMod, V, exec, ~/.local/bin/open-clipboard
bind = $mainMod SHIFT, N, exec, ~/.local/bin/open-notifications
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, W, togglefloating,
bind = $mainMod, A, exec, ~/.local/bin/rofi-style3-monitor-adaptive
bind = $mainMod, Tab, workspace, overview
bind = $mainMod ALT, Tab, exec, ~/.local/bin/adaptive-rofi window
bind = $mainMod, P, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, P, exec, hyprpicker -a
bind = $mainMod, J, layoutmsg, togglesplit
bind = ALT, Return, fullscreen, 0
bind = $mainMod, L, exec, hyprlock
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/toggle_performance.sh
bind = $mainMod, BackSpace, exec, ~/.local/bin/powermenu-with-monitor-detection
bind = $mainMod, XF86Back, exec, ~/.local/bin/pywal-wallpaper-sync
bind = $mainMod, Prior, exec, ~/.local/bin/pywal-wallpaper-sync
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper-selector
bind = $mainMod SHIFT, w, exec, ~/.local/bin/wallpaper-selector
bind = SUPER SHIFT, W, exec, ~/.local/bin/wallpaper-selector
bind = SUPER SHIFT, w, exec, ~/.local/bin/wallpaper-selector
bind = $mainMod CONTROL, W, exec, ~/.local/bin/wallpaper-selector
bind = $mainMod CONTROL, w, exec, ~/.local/bin/wallpaper-selector
bind = SUPER CONTROL, W, exec, ~/.local/bin/wallpaper-selector
bind = SUPER CONTROL, w, exec, ~/.local/bin/wallpaper-selector
bind = $mainMod ALT, W, exec, ~/.local/bin/wallpaper-changer-with-waybar-sync
bind = $mainMod ALT, w, exec, ~/.local/bin/wallpaper-changer-with-waybar-sync
bind = SUPER ALT, W, exec, ~/.local/bin/wallpaper-changer-with-waybar-sync
bind = SUPER ALT, w, exec, ~/.local/bin/wallpaper-changer-with-waybar-sync
bind = $mainMod SHIFT, B, exec, ~/.local/bin/wallpaper-change-adaptive
bind = $mainMod SHIFT, b, exec, ~/.local/bin/wallpaper-change-adaptive
bind = SUPER SHIFT, B, exec, ~/.local/bin/wallpaper-change-adaptive
bind = SUPER SHIFT, b, exec, ~/.local/bin/wallpaper-change-adaptive

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume and brightness controls
bindel = ,XF86AudioRaiseVolume, exec, ~/.local/bin/volume-dynamic up
bindel = ,XF86AudioLowerVolume, exec, ~/.local/bin/volume-dynamic down
bindel = ,XF86AudioMute, exec, ~/.local/bin/volume-dynamic mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.local/bin/brightness-dynamic up
bindel = ,XF86MonBrightnessDown, exec, ~/.local/bin/brightness-dynamic down

# Media keys
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Quick system toggles
bind = , F10, exec, ~/.local/bin/toggle-bluetooth
bind = $mainMod, K, exec, ~/.local/bin/toggle-keyboard-layout
bind = $mainMod ALT, K, exec, ~/.local/bin/cast-screen
bind = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , F12, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86KbdBrightnessDown, exec, ~/.local/bin/keyboard-backlight down
bind = , XF86KbdBrightnessUp, exec, ~/.local/bin/keyboard-backlight up
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/power_save.sh
bind = $mainMod CONTROL, D, exec, ~/.local/bin/toggle-dnd
