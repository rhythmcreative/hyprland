general {
    col.active_border = rgba(8d909e77)
    col.inactive_border = rgba(43475255)
}

misc {
    background_color = rgba(111319FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(111319FF)
        col.text = rgba(e2e2eaFF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(e2e2ea), 13, 󰖭, hyprctl eval 'hl.dsp.window.kill()'
        hyprbars-button = rgb(e2e2ea), 13, 󰖯, hyprctl eval 'hl.dsp.window.fullscreen(1)'
        # Antes: hyprctl dispatch movetoworkspacesilent special, que en
        # Hyprland 0.56 falla con "')' expected near 'special'" y no hacia nada.
        # special-silent mueve la ventana al workspace especial con la API de lua
        # y vuelve al workspace de antes, que es lo que hacia "silent".
        hyprbars-button = rgb(e2e2ea), 13, 󰖰, ~/.local/bin/special-silent
    }
}

windowrule = border_color rgba(afc6ffAA) rgba(afc6ff77), match:pin 1
